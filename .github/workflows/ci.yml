name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # brua runs the shared selection fixtures; brua-android renders BruaImage under Robolectric with the runner's Android SDK,
      # on Java 21, which Robolectric's newest Android images need.
      - run: ./gradlew test
